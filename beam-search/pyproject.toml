[project]
name = "gift-to-moodlexml"
version = "0.1.2"
description = "Extended GIFT format to Moodle XML question parser"
authors = [
    {name = "Benedikt Kantz",email = "benedikt@kantz.at"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyparsing (>=3.3.2,<4.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "markdown (>=3.10.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true